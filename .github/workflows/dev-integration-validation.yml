name: Dev Integration Validation
on:
  push:
    branches:
      - 'dev/integracoes-e2e-20260902'
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/integration-contracts.mjs
      - run: npm run build
